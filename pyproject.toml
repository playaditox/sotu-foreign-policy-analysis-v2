[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sotu-foreign-policy-v2"
version = "2.0.0"
description = "Released v2 presidential foreign-policy analysis"
requires-python = ">=3.12"
dependencies = ["numpy==2.5.4", "scipy==1.18.1", "scikit-learn==1.7.2"]

[tool.setuptools.packages.find]
where = ["src"]
